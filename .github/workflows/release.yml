# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# docs: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: 🚀 Release

on:
  release: {types: [published]}
  workflow_dispatch: {}

jobs:
  build-mod:
    name: Build the mod (pbo) file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with: {path: ./tools, key: "${{ runner.os }}-makefile-${{ hashFiles('Makefile') }}"}
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends --yes libvorbisenc2
      - run: make dist/mod
      - run: zip -r -X ../mod.zip ./*
        working-directory: ./dist
      - run: tar --create --gzip --file=../mod.tar.gz --mtime='@0' --owner=0 --group=0 *
        working-directory: ./dist
      - uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./mod.zip
          asset_name: mod.zip
          tag: ${{ github.event.release.tag_name }}
      - uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./mod.tar.gz
          asset_name: mod.tar.gz
          tag: ${{ github.event.release.tag_name }}
